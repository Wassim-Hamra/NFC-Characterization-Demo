      .nxp-text { font-family: 'Avenir', 'Nunito Sans', 'Arial', sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -1px; }
    </style>
  </defs>
  <!-- N -->
  <text x="4" y="48" class="nxp-text nxp-n">N</text>
  <!-- X -->
