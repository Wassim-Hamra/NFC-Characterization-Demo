  <!-- P -->
  <text x="81" y="48" class="nxp-text nxp-p">P</text>
  <!-- Tagline dots -->
  <circle cx="122" cy="40" r="3" fill="#FCA600" opacity="0.8"/>
  <circle cx="132" cy="40" r="3" fill="#0EAFE0" opacity="0.8"/>
